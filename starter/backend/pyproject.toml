[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
    "e2e: pruebas HTTP contra FastAPI y PostgreSQL migrado",
    "real_ai: smoke opt-in que consume una llamada real de proveedor",
    "real_trends: smoke opt-in que consume una consulta real por fuente de tendencias",
    "real_images: smoke opt-in que consume una generación real de imagen",
    "real_video: smoke opt-in que consume una generación real de video",
    "real_social: smoke opt-in que consume una llamada real a una red social",
]
