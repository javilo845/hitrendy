[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[agents.hitrendy_researcher]
description = "Read-only HiTrendy investigator for environment discovery, dependency mapping, requirements, and architecture analysis."
config_file = "./agents/hitrendy-researcher.toml"

[agents.hitrendy_reviewer]
description = "Read-only HiTrendy reviewer for diffs, contracts, security boundaries, tests, accessibility, and production risks."
config_file = "./agents/hitrendy-reviewer.toml"
