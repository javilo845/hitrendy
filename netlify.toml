# Netlify Configuration for HiTrendy Web App

[build]
  base = "starter/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  included_files = [
    "node_modules/next/**",
    "node_modules/styled-jsx/**",
    "node_modules/@next/**",
    "node_modules/@swc/**",
    "node_modules/react/**",
    "node_modules/react-dom/**",
    ".next/**"
  ]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
